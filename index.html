<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root { --bg:#0a0a0a; --fg:#e8e8e8; --green:#3dd68c; --red:#ff5c5c; --muted:#888; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px -apple-system,system-ui,sans-serif; padding:env(safe-area-inset-top) 16px 16px; }
    .big { font-size:42px; font-weight:600; letter-spacing:-1px; }
    .green { color:var(--green); } .red { color:var(--red); }
    .row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #222; }
    button { background:#1a1a1a; color:var(--fg); border:0; padding:14px; border-radius:12px; font-size:16px; width:100%; margin-top:8px; }
    #feed { margin-top:20px; }
  </style>
</head>
<body>
  <div id="mode">PAPER</div>
  <div class="big" id="balance">$200.00</div>
  <div id="status">loading…</div>
  <div class="row"><span>Agents</span><span id="agents">—</span></div>
  <div class="row"><span>Waiting room</span><span id="waiting">—</span></div>
  <button onclick="showSettings()">Settings</button>
  <button onclick="location.reload()">Refresh</button>
  <div id="settings" style="display:none; margin-top:20px;">
    <h3>Settings</h3>
    <div class="row"><span>Mode</span><span id="set-mode">PAPER</span></div>
    <div class="row"><span>Min liquidity</span><span id="set-liq">40000</span></div>
    <div class="row"><span>Max top10 %</span><span id="set-top10">25</span></div>
    <div class="row"><span>Stop %</span><span id="set-stop">6</span></div>
    <button onclick="hideSettings()">Back</button>
  </div>
  <div id="feed"></div>
<script>
const FALLBACK = "8ec_VPu8aHRwLHUzlsTiIEkgNuEOssOcKWADFXrmuYM";
const DATA = window.location.hash.slice(1) || localStorage.getItem("dataPath") || FALLBACK;
if (DATA) localStorage.setItem("dataPath", DATA);
async function poll() {
  if (!DATA) { document.getElementById("status").textContent = "no data path"; return; }
  try {
    const r = await fetch("d/" + DATA + "/state.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    document.getElementById("mode").textContent = s.mode || "PAPER";
    document.getElementById("balance").textContent = "$" + (s.balance || 0).toFixed(2);
    document.getElementById("agents").textContent = (s.agents || []).join(" · ");
    document.getElementById("waiting").textContent = s.waiting_room ?? "—";
    document.getElementById("status").textContent = "live · " + new Date(s.ts).toLocaleTimeString();
  } catch (e) {
    document.getElementById("status").textContent = "offline · " + e.message;
  }
}
setInterval(poll, 15000);
poll();
function showSettings() {
  document.getElementById("settings").style.display = "block";
}
function hideSettings() {
  document.getElementById("settings").style.display = "none";
}
</script>
</body>
</html>
